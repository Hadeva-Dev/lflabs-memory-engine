[project]
name = "lflabs-memory-engine"
version = "0.1.5"
description = "Local long-term memory for AI assistants: SQLite + vectors + keyword search"
readme = "README.md"
authors = [{ name = "LF Labs" }]
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.2",
]

[project.scripts]
lflabs-memory = "lflabs_memory.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lflabs_memory"]
